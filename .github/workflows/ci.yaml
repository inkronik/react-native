name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies and verify security patches
        run: bun run audit

      - name: Test
        run: bun run test

      - name: Test native crash harness contract
        run: bun run test:native-harness

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck native crash harness
        run: bun run typecheck:native-harness

      - name: Check lint
        run: bun run check:lint

      - name: Check native crash harness lint
        run: bun run check:lint:native-harness

      - name: Check formatting
        run: bun run check:format

      - name: Build
        run: bun run build

      - name: Verify Expo prebuild and EAS autolinking contract
        run: bun run check:expo-prebuild

      - name: Verify packed consumer and generate runtime SBOM
        run: |
          mkdir artifacts
          node scripts/check-package.mjs --output artifacts/package.tgz
          node scripts/check-package-consumer.mjs --package artifacts/package.tgz
          node scripts/generate-sbom.mjs --package artifacts/package.tgz --output artifacts/package.cdx.json

      - name: Upload runtime SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-sbom
          path: artifacts/package.cdx.json
          if-no-files-found: error
          retention-days: 7

  compatibility-android-rn-0-65:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          package-manager-cache: false

      - name: Setup Java 11
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install exact SDK dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Install exact Android native toolchain
        run: sdkmanager --install 'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: Verify React Native 0.65 Android compatibility
        run: bun run check:compatibility:rn-0.65:android

  compatibility-ios-rn-0-65:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install exact SDK dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Verify React Native 0.65 iOS compatibility
        run: bun run check:compatibility:rn-0.65:ios
