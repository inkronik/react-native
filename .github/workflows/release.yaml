name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Stable releases use main; prereleases use rc
        required: true
        default: main
        type: choice
        options:
          - main
          - rc
      dry_run:
        description: Build and verify without creating a GitHub release or publishing to npm
        required: true
        default: true
        type: boolean
      native_parity_approved:
        description: Confirm the native parity report and capture ADR are approved (required for publication)
        required: true
        default: false
        type: boolean

concurrency:
  group: npm-release-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE_NAME: '@inkronik/react-native'

jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require approved native parity for a real release
        if: ${{ !inputs.dry_run && !inputs.native_parity_approved }}
        run: |
          echo 'A real release requires an approved native parity report and accepted capture ADR.' >&2
          exit 1

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/heads/${{ inputs.branch }}

      - name: Record exact release source
        id: source
        run: |
          source_sha="$(git rev-parse HEAD)"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source commit: $source_sha" >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies and verify security patches
        run: bun run audit

      - name: Determine and validate release version
        id: version
        env:
          RELEASE_BRANCH: ${{ inputs.branch }}
        run: |
          case "$RELEASE_BRANCH" in
            main) version="$(bun run --silent release:version)" ;;
            rc) version="$(bun run --silent release:version -- --preRelease=rc)" ;;
            *)
              echo "Unsupported release branch: $RELEASE_BRANCH" >&2
              exit 1
              ;;
          esac

          if git rev-parse --verify --quiet "refs/tags/v$version"; then
            echo "Release tag v$version already exists." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare versioned source
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts

      - name: Test versioned source
        run: bun run test

      - name: Typecheck versioned source
        run: bun run typecheck

      - name: Check versioned source lint
        run: bun run check:lint

      - name: Check versioned source formatting
        run: bun run check:format

      - name: Build versioned package
        run: bun run build

      - name: Pack and inspect release artifact
        run: |
          mkdir release
          node scripts/check-package.mjs --output release/package.tgz
          tar -tzf release/package.tgz

      - name: Test packed package installation without lifecycle scripts
        run: node scripts/check-package-consumer.mjs --package release/package.tgz

      - name: Generate runtime SBOM
        run: node scripts/generate-sbom.mjs --package release/package.tgz --output release/package.cdx.json

      - name: Create package checksum
        run: |
          pushd release >/dev/null
          sha256sum package.tgz > package.tgz.sha256
          popd >/dev/null

      - name: Upload verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  compatibility-android-rn-0-65:
    needs: prepare-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-and-verify.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Setup Java 17 for Android SDK tools
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup exact Android native toolchain
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: '14742923'
          log-accepted-android-sdk-licenses: false
          packages: 'ndk;27.1.12297006 cmake;3.22.1'

      - name: Setup Java 11 for React Native 0.65
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install exact SDK dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Verify React Native 0.65 Android compatibility
        run: bun run check:compatibility:rn-0.65:android

  compatibility-ios-rn-0-65:
    needs: prepare-and-verify
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-and-verify.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install exact SDK dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Verify React Native 0.65 iOS compatibility
        run: bun run check:compatibility:rn-0.65:ios

  create-github-release:
    if: ${{ !inputs.dry_run && inputs.native_parity_approved }}
    needs:
      - prepare-and-verify
      - compatibility-android-rn-0-65
      - compatibility-ios-rn-0-65
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create tag and GitHub release at exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ inputs.branch }}
          RELEASE_VERSION: ${{ needs.prepare-and-verify.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare-and-verify.outputs.source_sha }}
        run: |
          stable_version_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          prerelease_version_pattern='^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'
          sha_pattern='^[0-9a-f]{40}$'

          case "$RELEASE_BRANCH" in
            main) version_pattern="$stable_version_pattern" ;;
            rc) version_pattern="$prerelease_version_pattern" ;;
            *) exit 1 ;;
          esac

          if [[ ! "$RELEASE_VERSION" =~ $version_pattern || ! "$SOURCE_SHA" =~ $sha_pattern ]]; then
            echo 'Invalid release metadata.' >&2
            exit 1
          fi

          tag="v$RELEASE_VERSION"
          release_args=(release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "$tag" --generate-notes --fail-on-no-commits)
          if [[ "$RELEASE_BRANCH" = "rc" ]]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--latest)
          fi
          gh "${release_args[@]}"

  publish-npm:
    if: ${{ !inputs.dry_run && inputs.native_parity_approved }}
    needs:
      - prepare-and-verify
      - create-github-release
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js for npm publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Verify package digest and metadata
        env:
          RELEASE_VERSION: ${{ needs.prepare-and-verify.outputs.version }}
        run: |
          pushd release >/dev/null
          sha256sum --check package.tgz.sha256
          popd >/dev/null
          tar -xOf release/package.tgz package/package.json | node -e '
            const fs = require("node:fs")
            const [expectedName, expectedVersion] = process.argv.slice(1)
            const manifest = JSON.parse(fs.readFileSync(0, "utf8"))
            if (manifest.name !== expectedName || manifest.version !== expectedVersion) process.exit(1)
          ' "$PACKAGE_NAME" "$RELEASE_VERSION"

      - name: Publish exact package artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_BRANCH: ${{ inputs.branch }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo 'NPM_TOKEN is required for npm publication.' >&2
            exit 1
          fi
          if [[ "$RELEASE_BRANCH" = "rc" ]]; then npm_tag=rc; else npm_tag=latest; fi
          npm publish ./release/package.tgz --access public --provenance --tag "$npm_tag" --ignore-scripts
